# Candidate mechanism signatures for the recurrent ISS-T remodeling axis.
#
# These sets are intentionally compact, curated mouse-compatible symbols.  The
# runner resolves symbols case-insensitively through data/processed/resources/id_map.tsv.
# role:
#   outcome_anchor       = biology used to define/check the remodeling axis
#   candidate_upstream  = candidate upstream mechanism/context score
#   candidate_context   = secondary contextual program

