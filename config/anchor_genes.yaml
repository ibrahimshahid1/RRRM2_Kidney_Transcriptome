# Pre-registered Procrustes anchor candidates.
#
# These are external, housekeeping/maintenance candidates used only for
# alignment. They are not selected from observed Phase 3 rewiring. Phase 2
# force-includes mapped Ensembl IDs from this file so Phase 3 can fail fast if
# too few configured anchors survive the expression universe.
#
# Primary anchors intentionally exclude ribosome/translation, ISR, PPAR,
# mitochondrial-stress, and kidney-injury biology because those pathways are
# downstream signals of interest in this study.

anchors:
  classical_housekeeping:
    role: primary_alignment
    description: "Widely used housekeeping genes; Hprt corrected to Hprt1."
    genes:
      - Actb
      - B2m
      - Gapdh
      - Gusb
      - Hmbs
      - Hprt1
      - Pgk1
      - Polr2a
      - Ppia
      - Pum1
      - Rer1
      - Tbp
      - Ubc
      - Ywhaz

  basal_transcription:
    role: primary_alignment
    description: "Core transcription machinery, excluding translation factors."
    genes:
      - Gtf2b
      - Gtf2f1
      - Gtf2h1
      - Gtf2h2
      - Gtf2i
      - Taf1
      - Taf2
      - Taf7
      - Tceb1
      - Tceb2
      - Tceb3
      - Polr2b
      - Polr2c
      - Polr2d
      - Polr2e
      - Polr2f
      - Polr2g
      - Polr2h
      - Polr2i
      - Polr2j
      - Polr2k
      - Polr2l

  proteostasis_non_ribosomal:
    role: primary_alignment
    description: "Ubiquitin/proteasome maintenance genes; no ribosomal proteins."
    genes:
      - Psma1
      - Psma2
      - Psma3
      - Psma4
      - Psma5
      - Psma6
      - Psma7
      - Psmb1
      - Psmb2
      - Psmb3
      - Psmb4
      - Psmb5
      - Psmb6
      - Psmb7
      - Psmc1
      - Psmc2
      - Psmc3
      - Psmc4
      - Psmc5
      - Psmc6
      - Psmd1
      - Psmd2
      - Psmd3
      - Psmd4
      - Psmd5
      - Psmd6
      - Psmd7
      - Psmd8
      - Psmd9
      - Psmd10
      - Psmd11
      - Psmd12
      - Psmd13
      - Psmd14
      - Uba1
      - Ube2d2
      - Ube2d3
      - Ube2e1
      - Ube2i
      - Ube2l3

  trafficking_cytoskeleton:
    role: primary_alignment
    description: "Constitutive trafficking/cytoskeleton maintenance genes."
    genes:
      - Ap2m1
      - Arf1
      - Arf3
      - Cltc
      - Copa
      - Copb1
      - Copb2
      - Rab1a
      - Rab5c
      - Rab7
      - Rab10
      - Tuba1b
      - Tubb5
      - Actg1
      - Vcp

selection_criteria:
  source: "External housekeeping/maintenance candidate set; no observed rewiring ranking."
  max_cv: null
  min_de_fdr: null
  min_expression_tpm: null
  excludes:
    - ribosome_or_translation
    - integrated_stress_response
    - ppar_signaling
    - mitochondrial_stress
    - kidney_injury_markers

validation:
  minimum_anchors: 20
  warn_threshold: 50

notes: |
  Anchors are configured, mapped from symbols to Ensembl IDs through
  data/processed/resources/id_map.tsv, and force-included into the Phase 2 gene
  panel when present in the expression universe. Phase 3 must fail if fewer than
  minimum_anchors mapped anchors are present in phase2_genes.txt, and should warn
  below warn_threshold.

  Ribosomal genes from older exploratory configs are deliberately excluded from
  the primary anchor pool because translation/ribosome biology is a result, not
  an alignment reference. Any exploratory stability-derived anchors must be
  reported separately and must not be called pre-registered.
