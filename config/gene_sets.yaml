# Kidney-Specific Cell Type Markers
# NOTE: Kidney segment marker sets (DCT, PT, CD, glomerulus, etc.) are no
# longer hardcoded here. They are discovered data-driven by Phase 1.6
# (src/markers/discover_markers.py) and loaded automatically by
# gene_set_loader.load_segment_marker_panels().

# Gene Set Enrichment Databases
enrichment_databases:
  use:
    - GO_Biological_Process
    - GO_Molecular_Function
    - KEGG_Pathways
    - Reactome
    - WikiPathways

  parameters:
    min_set_size: 10
    max_set_size: 500
    FDR_threshold: 0.05

# Silent Shifter Prioritization
silent_shifter_criteria:
  delta_percentile: 90      # Top 10% rewiring
  log2fc_threshold: 0.3     # shrunken |log2FC| < 0.3
  log2fc_ci_inside_fraction: 0.8  # ≥80% of 95% CI inside [-0.3, 0.3]
  de_fdr_alpha: 0.05        # not significant by DE if FDR >= 0.05
  delta_fdr_threshold: 0.1  # FDR < 0.1 (significant rewiring)

# Module Detection
module_detection:
  method: "kmeans"
  n_clusters: [5, 10, 15, 20]  # Try multiple k values
  cluster_stability: true       # Use consensus clustering
