# Nephron-segment identity panels (PT, TAL, CNT/CD, intercalated).
# DCT and ASDN panels live in dct_asdn_transport.yaml.
#
# Extracted 2026-08-28 by an inventory pass over src/**, scripts/**, tests/**.
# Membership and ordering are reproduced EXACTLY as they appear in the source
# literal. Nothing was added, dropped, corrected, or reordered.
#
# provenance.frozen: true marks a panel that belongs to a locked analysis
# (config/clinical_renal_axes_cross_mission.yaml,
#  config/dct_asdn_phospho_reanalysis.yaml,
#  config/dct_subtype_reference_freeze_v1.yaml).  Those entries must never be
# edited; see docs/GENE_PANEL_INVENTORY.md section 4.
#
# See docs/GENE_PANEL_INVENTORY.md for the duplication/drift analysis.

