schema_version: 1

id: v13-compartment
title: v13 compartment adversarial closure audit
workflow: C
status: complete
lock_date: 2026-08-02

question: >-
  Once the exact v13 label permutation is fixed, does the podocyte-leading
  compartment result survive an adversarial closure audit of artifact,
  contributor, observability, Grey60, and clinical-axis explanations?

conclusion: >-
  The audit is parent-protein annotation enrichment in whole kidney. It does
  not identify a phosphosite's cell of origin and does not repair the perfect
  condition-to-reporter-block alias in OSD-462. The 2026-08-02 stop rule
  retired further OSD-462 compartment mining.

spec_config: config/v13_compartment_adversarial_audit.yaml
docs:
  - docs/V13_COMPARTMENT_ADVERSARIAL_AUDIT_PLAN_2026-08-02.md
  - docs/POST_V13_DIRECTION_DECISION_2026-08-11.md

results_root: data/results/v13-compartment
reference_run: data/archive/results/run_20260802_v13_compartment_adversarial
figures_root: figures/v13

requires:
  data:
    - data/external
  r: false

# The audit post-processes the archived exact run and the legacy OSD-462 / Grey60
# diagnostics named below. Those run directories are not in a fresh checkout and
# regenerating them is out of scope, so `rrrm2 doctor` reports this revision as
# BLOCKED until they are restored. Marker-tier preparation (the audit script's
# `prepare` subcommand) is registered as the optional clinical-axes stage
# `marker-tiers`; it is NOT repeated here.
stages:
  - id: audit
    title: Effect-aware post-processing of the archived exact run (legacy inputs required)
    needs: []
    runner: python
    entry: scripts/v13/compartment_adversarial_audit.py
    args:
      - "--config"
      - "{spec_config}"
      - "postprocess"
      - "--exact-dir"
      - "data/archive/results/run_20260802_v13_compartment_exact"
      - "--output-dir"
      - "{run_dir}"
    optional: false
    requires:
      - data/archive/results/run_20260802_v13_compartment_exact
      - data/results/run_20260729_v13_continuous_phospho_exact_final
      - data/results/run_20260729_v13_intensity_confound_audit
      - data/results/run_20260729_osd462_reporter_position
      - data/results/run_20260729_osd462_layer_block_shift
      - data/results/run_20260729_grey60_adversarial/internal/influence/gene_contrasts.tsv
      - data/results/run_20260728_osd462_stage0/reporting/osd462_slc12a3_stk39_phosphoform_provenance_compact.tsv
      - data/results/codex_review_osd462/osd462_anchor/protein_effects_gene_anyplex.tsv
      - data/processed/v13_compartment_audit/frozen_compartment_tiers.tsv
    outputs: []
