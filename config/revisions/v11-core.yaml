schema_version: 1

id: v11-core
title: v11 DCT1 phospho mediation and layer specificity
workflow: '-'
status: retired
lock_date: 2026-06-07

question: >-
  Does flight-associated phosphorylation suppression on the DCT1/NCC axis
  mediate a downstream transcriptional layer effect, and is that effect
  layer-specific?

conclusion: >-
  Superseded and retracted. The v11/v12 headline rested on OSD-462 phosphosite
  features that the osd462-stage0 audit later showed to be co-modified peptides
  with no isolated qualification-passing canonical NCC/SPAK phosphoform, in a
  design where condition is perfectly aliased with reporter-tag block. Kept for
  historical reproduction only; do not cite its outputs as current results.

spec_config: null
