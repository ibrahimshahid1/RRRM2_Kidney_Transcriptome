analysis_id: clinical_renal_axes_cross_mission_v1
lock_date: 2026-08-11
status: frozen_retrospective_targeted_analysis
seed: 20260811

question: >-
  Which clinically anchored renal tissue programs show directional engagement
  during terminal spaceflight, and which recur across independent mouse
  missions?

interpretation_boundary:
  allowed:
    - kidney tissue transcriptional program engagement
    - cross-mission recurrence or heterogeneity
    - nomination of urine, blood, or histology assays for prospective measurement
  prohibited:
    - measured urinary or circulating biomarker change
    - AKI or CKD diagnosis
    - albuminuria or filtration-barrier failure
    - histologic fibrosis or renal morphology
    - renal cancer risk

primary_family:
  # All scores are oriented so a positive value denotes the declared adverse
  # tissue-program direction. Genes are equally weighted within a subdomain;
  # subdomains are equally weighted within a composite axis.
  glomerular_barrier_identity_loss:
    role: primary_biological_axis
    direction_label: lower podocyte/barrier identity
    subdomains:
      barrier_core:
        genes:
          Nphs1: -1
          Nphs2: -1
          Synpo: -1
          Ptpro: -1
          Magi2: -1
          Wt1: -1
        minimum_present: 4
    sensitivity_additions:
      barrier_expanded:
        Podxl: -1
        Cd2ap: -1

  tubular_epithelial_injury_induction:
    role: primary_biological_axis
    direction_label: higher tubular epithelial injury response
    subdomains:
      injury_core:
        genes:
          Havcr1: 1
          Lcn2: 1
        minimum_present: 2
    gene_level_requirement: both genes must be observable and reported separately
    secondary_markers:
      Il18: 1

  fibrosis_maladaptive_remodeling:
    role: primary_biological_axis
    direction_label: higher maladaptive repair and matrix deposition
    subdomains:
      maladaptive_repair:
        genes:
          Dkk3: 1
          Mmp7: 1
          Timp1: 1
          Ccl2: 1
          Egf: -1
        minimum_present: 4
      extracellular_matrix_deposition:
        genes:
          Col1a1: 1
          Col1a2: 1
          Col3a1: 1
          Col6a1: 1
          Col6a2: 1
          Col6a3: 1
          Fn1: 1
          Postn: 1
        minimum_present: 6
    pass_requirement: both subdomains retain the pooled direction

  distal_transport_identity_loss:
    role: contextual_reference_axis
    direction_label: lower distal epithelial transport-associated transcript abundance
    subdomains:
      dct_identity:
        genes:
          Slc12a3: -1
          Pvalb: -1
          Trpm6: -1
          Kcnj10: -1
          Kcnj16: -1
          Clcnkb: -1
        minimum_present: 5
      asdn_identity:
        genes:
          Hsd11b2: -1
          Nr3c2: -1
          Sgk1: -1
          Nedd4l: -1
          Scnn1a: -1
          Scnn1b: -1
          Scnn1g: -1
        minimum_present: 6
    interpretation_note: >-
      This is transcript abundance/identity, not transporter flux or WNK-SPAK
      kinase activity. It is included in the four-axis multiplicity family but
      cannot by itself make the study a biological go.

