gene_mapping:
  path: data/processed/resources/id_map.tsv
  annotation_fallback: data/external/osdr/OSD-462/GLDS-462_rna_seq_differential_expression_totRNA_GLbulkRNAseq.csv
  ensembl_column: ensembl_gene_id
  symbol_column: mgi_symbol
  strip_ensembl_version: true

eligibility:
  count_filter: CPM >= 0.1 in at least half of either contrasted arm within a mission
  cpm_threshold: 0.1
  axis_coverage: every subdomain-specific minimum must be met
  no_gene_substitution: true
  one_biological_kidney_per_animal: true

technical_qc:
  primary_metric: ratio_genebody_cov_3_to_5
  secondary_metrics:
    - rin
    - read_depth
    - uniquely_mapped_percent
  exact_analysis_cells_only: true
  imbalance_flag: two-sided Welch p < 0.05 and absolute Hedges g >= 0.50
  handling: >-
    A flagged primary coverage imbalance excludes that mission from the primary
    synthesis; secondary metric flags trigger a covariate sensitivity rather
    than automatic exclusion. Technical replicates are collapsed to one
    biological-animal value before QC and expression scoring.

primary_scoring:
  method: signed mean of gene z-scores
  standardization: >-
    Gene-wise z-score over the complete frozen mission analysis set; do not
    standardize separately within age or duration blocks.
  subdomain_weighting: equal
  axis_weighting: equal subdomain weight
  sensitivities:
    - signed median within subdomain
    - common gene intersection across eligible missions
    - leave one gene out
    - leave one mission out

inference:
  mission_effect: Hedges g, flight minus matched ground control
  within_mission_strata: inverse-variance fixed-effect combination
  meta_analysis: REML random effects with modified Hartung-Knapp uncertainty
  prediction_interval: true
  primary_multiplicity: blocked whole-pipeline max absolute meta-statistic across four axes
  permutations: 100000
  monte_carlo_correction: plus_one
  conventional_sensitivity: Holm-adjusted modified-Hartung-Knapp p-values

go_no_go:
  axis_go:
    - maxT_FWER <= 0.05
    - modified_HK_95CI excludes 0
    - at least 4 of 5 mission effects, or 3 of 4 eligible mission effects, share pooled direction
    - every leave-one-mission pooled estimate retains direction
    - no mission random-effects weight exceeds 0.50
    - I2 < 60 percent for a recurrence claim
    - every leave-one-gene estimate retains direction and at least 50 percent of full magnitude
    - no single gene contributes more than 25 percent of aggregate signed effect
    - mean, median, and common-intersection scores agree in direction
  paper_go: >-
    At least one of glomerular barrier, tubular injury, or
    fibrosis/maladaptive remodeling passes all required gates. A distal-only
    result is not a paper go.

excluded_primary_markers:
  Fabp1: ordinary wild-type mouse kidney does not model human renal L-FABP expression
  B2m: tissue RNA is ubiquitous and immune-sensitive; urinary analyte depends on filtration and reabsorption
  Cst3: kidney tissue RNA is not a filtration or circulating cystatin-C assay proxy
  Timp2_Igfbp7_pair: urinary protein risk assay is not represented by directional tissue transcript abundance
  Tgfb1: bulk transcript abundance does not measure latent TGF-beta activation

provenance_disclosure: >-
  This lock was created after earlier repository analyses had already shown an
  ECM/fibrosis-like RNA signal and a heterogeneous distal-transport signal.
  It is therefore retrospective, not preregistered. The glomerular-barrier and
  HAVCR1/LCN2 panel-level results had not been inspected before this file was
  frozen. All deviations require a dated changelog and cannot replace the
  primary result.

lock_amendments:
  - date: 2026-08-11
    stage: label-blind observability audit before any new axis effect was computed
    change: CPM eligibility threshold changed from 1.0 to 0.1
    reason: >-
      CPM 1.0 made the two-gene HAVCR1/LCN2 endpoint unavailable in two
      missions and excluded four of five repair genes despite finite processed
      measurements. CPM 0.1 retains markers with roughly 5-15 expected counts
      in these libraries while still excluding near-zero features such as Mmp7
      where not observably measured. No flight-control direction or effect
      estimate was examined before this amendment.
