# Cross-OSDR Network-Contrast Framework — pre-registered configuration.
#
# Locked May 2026. Sourced from agents_instruction.md (canonical reference) §4.
# Any change here must be paired with a docs/plan_changelog.md entry.
#
# The orchestrator scripts/run_contrast_vector_framework.py reads this file.
# Do NOT hard-code thresholds or bootstrap counts inside Python modules — read
# them from here.

framework:
  name: "Cross-OSDR Network-Contrast Framework"
  scope: "minimum_viable"          # minimum_viable | extension
  version: "1.0"
  pre_registered: true
  reference_document: "agents_instruction.md"

# §2.4 / §2.1 — bootstrap and permutation iteration counts.
bootstrap:
  n_iterations: 2000
  random_seed: 20260101
  stratify_by: ["Age", "Arm", "EnvGroup"]
  ci_alpha: 0.05                   # 95% percentile interval

permutation:
  n_iterations: 5000
  random_seed: 20260102
  stratify_within: ["Age", "Arm"]

# §2.2 — resolution hierarchy + stability gates.
# stability_median = required median bootstrap-vs-full cosine
# stability_lower  = required 2.5th-percentile bootstrap-vs-full cosine
# role             = primary | secondary | exploratory (initial assignment)
resolutions:
  module:
    role: "primary"
    stability_median: 0.60
    stability_lower: 0.40
    on_fail: "fallback_external_axis_only"
  pathway:
    role: "primary"
    stability_median: 0.60
    stability_lower: 0.40
    on_fail: "demote_to_exploratory"
  gene:
    role: "secondary"
    stability_median: 0.40
    stability_lower: 0.20
    on_fail: "demote_to_exploratory"
  lioness_node:
    role: "secondary"
    stability_median: 0.40
    stability_lower: 0.20
    on_fail: "demote_to_exploratory"
  edge:
    role: "exploratory"
    stability_median: 0.30
    stability_lower: 0.10
    on_fail: "demote_to_exploratory"

# §2.3 — shrinkage / precision weighting.
shrinkage:
  enabled: true
  variance_floor_percentile: 10    # epsilon = 10th percentile of variance estimates

# §4.2 — significance categorization (decomposition).
decomposition_significance:
  beta_ci_must_exclude: [0.0, 1.0]
  cos_ci_must_exclude: [0.0]
  cos_lower_bound_min_abs: 0.20
  rho_substantial_median: 0.50

# §4.3 — cross-OSDR recurrence thresholds.
recurrence:
  cosine_point_estimate_min: 0.20
  cosine_ci_lower_must_exceed: 0.0
  require_same_sign_as_rrrm2: true

# §4.4 — interpretation category boundaries.
interpretation_categories:
  amplify_min_beta: 1.0
  dampen_beta_range: [0.0, 1.0]
  reverse_max_beta: 0.0
  redirect_abs_beta_max: 0.10
  redirect_rho_min: 0.50
  headline_assignment_fraction: 0.70

# §3 — locked dataset roster (minimum viable).
datasets:
  minimum_viable:
    - id: "OSD-771"
      role: "primary_factorial_bridge"
      sex: "F"
      strain: "C57BL/6NTac"
      design: "Age x Arm x EnvGroup"
      n_per_cell: 5
    - id: "OSD-513"
      role: "powered_flight_vector"
      sex: "M"
      strain: "C57BL/6J"
      mission_days: 38
      n_per_group: 9
    - id: "OSD-253"
      role: "strain_duration_light_sensitivity"
      sex: "F"
      strains: ["C57BL/6J", "C3H/HeJ"]
      durations_days: [25, 75]
      control_scenarios: ["original_GC", "white_LED_2021"]
    - id: "TMS-kidney-female"
      role: "external_aging_axis"
      source: "Tabula Muris Senis"
  extension:
    - id: "OSD-102"
    - id: "OSD-163"
    - id: "OSD-462"
    - id: "OSD-457"
    - id: "OSD-913"

# §1 / §3 — pooling rule (absolute).
pooling_rule:
  pool_raw_expression_across_studies: false
  pool_contrast_level_statistics: true

# §5 Phase 0 / §6.3 — output layout root.
output:
  results_subdir: "contrast_vectors"
  manifest_filename: "manifest.json"
  stability_report: "agc_stability_report.tsv"
  stability_decision: "agc_stability_decision.json"
  manuscript_decision: "manuscript_decision.json"
  mechanism_axis_subdir: "mechanism_axis"

# §5 Phase 3 — branching behaviour on stability failures.
branching:
  on_module_fail: "external_axis_only"
  on_gene_fail: "demote_to_exploratory"
  on_edge_fail: "demote_to_exploratory"
  allow_silent_fallback: false

# §9 — engineering conventions enforced by the orchestrator.
engineering:
  require_manifest_per_phase: true
  require_run_id_timestamp: true
  fail_on_stability_fail_unless_bypass: true
  bypass_stability_flag: "--bypass-stability"
